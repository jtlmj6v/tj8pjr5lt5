function gl(a,b){return Math.min(6,Math.max(0,Math.round(Math.random()*2+(a-b)/14+Math.random()*1.1)))}
function simTie(a,b){let ra=clubRating(a),rb=clubRating(b),x=gl(ra,rb),y=gl(rb,ra);return x>y?a:y>x?b:(Math.random()<.5+(ra-rb)/150?a:b)}
