<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サッカー監督完全版 - 戦術・選手管理</title>
    <style>
        body { font-family: sans-serif; background: #12181f; padding: 15px; max-width: 550px; margin: 0 auto; color: #e2e8f0; }
        .card { background: #1e2530; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 15px; border: 1px solid #2d3748; }
        .nav { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .nav button { flex: 1; background: #2a4365; color: #fff; border: none; padding: 10px 5px; margin: 2px; border-radius: 4px; font-weight: bold; font-size: 12px; cursor: pointer; transition: background 0.2s; }
        .nav button:hover { background: #319795; }
        .hidden { display: none; }
        button.action-btn { background: #234e52; color: #e6fffa; border: 1px solid #319795; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin: 5px 0; transition: background 0.2s; }
        button.action-btn:hover { background: #2d6a6f; }
        button:disabled { background: #4a5568 !important; color: #a0aec0 !important; border-color: #4a5568 !important; cursor: not-allowed; }
        select { width: 100%; padding: 8px; margin: 5px 0 10px; border-radius: 4px; background: #2d3748; color: #fff; border: 1px solid #4a5568; }
        label { color: #cbd5e0; font-size: 14px; }
        hr { border: 0; border-top: 1px solid #2d3748; margin: 15px 0; }
        h1 { color: #fff; text-align: center; font-size: 24px; margin-bottom: 20px; }
        h2, h3 { color: #e2e8f0; margin-top: 0; }
        .player-list { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
        .player-item { display: flex; justify-content: space-between; align-items: center; background: #2d3748; padding: 8px 12px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; font-size: 14px; }
        .player-item:hover { background: #3a4a63; }
        .player-item.selected { border-color: #38bdf8; background: #243b53; }
        .pos { font-weight: bold; width: 40px; display: inline-block; }
        .pos.FW { color: #f56565; }
        .pos.MF { color: #4299e1; }
        .pos.DF { color: #48bb78; }
        .pos.GK { color: #ecc94b; }
        .p-stats { color: #a0aec0; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; background: #1a202c; }
        th, td { border: 1px solid #2d3748; padding: 8px; text-align: center; }
        th { background: #2a4365; color: white; }
        tr:nth-child(even) { background: #222a38; }
        #log { background: #0d1117; color: #38bdf8; padding: 10px; border-radius: 5px; height: 120px; overflow-y: auto; font-family: monospace; font-size: 13px; margin-top: 10px; border: 1px solid #2d3748; line-height: 1.5; }
    </style>
</head>
<body>

<h1>⚽ サッカー監督 Pro</h1>

<div class="nav">
    <button onclick="tab('home')">🏠 ホーム</button>
    <button onclick="tab('tactics')">📋 戦術</button>
    <button onclick="tab('train')">💪 育成</button>
    <button onclick="tab('rank')">📊 順位表</button>
    <button onclick="tab('match')">⚽ 試合</button>
</div>

<div id="view-home" class="view card">
    <h2>🏠 チーム管理</h2>
    <p>📅 <strong>進行度</strong>: 第 <span id="h-rd">1</span> / 34 節</p>
    <p>📅 <strong>次節の相手</strong>: <span id="h-opp">RIVAL FC</span></p>
    <p>🏋️‍♂️ <strong>練習残り</strong>: <span id="h-tc">1</span> 回</p>
    <hr>
    <p style="color:#38bdf8; font-weight:bold; font-size: 16px;">🔥 チーム総力: ⚔ATK <span id="h-fatk">0</span> / 🛡DEF <span id="h-fdef">0</span></p>
</div>

<div id="view-tactics" class="view card hidden">
    <h2>📋 戦術・チーム編成</h2>
    <label>陣形（フォーメーション）</label>
    <select id="sel-form" onchange="calc()">
        <option value="442">4-4-2 (バランス: 補正なし)</option>
        <option value="433">4-3-3 (超攻撃型: ATK+15 / DEF-5)</option>
        <option value="532">5-3-2 (堅守速攻: DEF+15 / ATK-5)</option>
    </select>
    <label>チームスタイル</label>
    <select id="sel-sty" onchange="calc()">
        <option value="bal">バランス良く戦う</option>
        <option value="atk">攻撃重視 (ATK+10 / DEF-5)</option>
        <option value="def">守備重視 (DEF+10 / ATK-5)</option>
    </select>
    <p style="font-size:12px; color:#38bdf8; margin: 10px 0;">💡 選手を2人タップするとスタメンとベンチを入れ替えられます</p>
    <h3>🏃‍♂️ スターティングイレブン</h3>
    <div class="player-list" id="list-starter"></div>
    <h3 style="margin-top:20px;">🪑 ベンチメンバー</h3>
    <div class="player-list" id="list-bench"></div>
</div>

<div id="view-train" class="view card hidden">
    <h2>💪 選手個別育成</h2>
    <p>今節のトレーニング残り: <span id="t-tc">1</span> 回</p>
    <div class="player-list" id="list-train-players" style="margin-bottom:15px; max-height:180px; overflow-y:auto; border:1px solid #4a5568; padding:5px; border-radius:4px;"></div>
    <button class="action-btn" onclick="train('atk')">🏋️‍♂️ 選択した選手の ATK +5</button>
    <button class="action-btn" onclick="train('def')">🏃‍♂️ 選択した選手の DEF +5</button>
</div>

<div id="view-rank" class="view card hidden">
    <h2>📊 リーグ順位表</h2>
    <table>
        <thead>
            <tr><th>順位</th><th>チーム名</th><th>試合</th><th>勝</th><th>分</th><th>敗</th><th>点</th></tr>
        </thead>
        <tbody id="rank-tbody"></tbody>
    </table>
</div>

<div id="view-match" class="view card hidden">
    <h2>⚽ 試合スタジアム</h2>
    <h3 style="text-align:center;"><span style="color:#38bdf8;">FC FUTURE</span> vs <span id="m-opp">RIVAL FC</span></h3>
    <div style="text-align:center; font-size:42px; font-weight:bold; color:#fff; margin:15px 0;">
        <span id="m-sh">0</span> - <span id="m-sa">0</span>
    </div>
    <button id="m-btn" class="action-btn" onclick="startMatch()">▶ 試合開始 (自動シミュレーション)</button>
    <div id="log">キックオフ前です...</div>
</div>

<script>
let round = 1, tCount = 1, fAtk = 0, fDef = 0, selectedPlayerIndex = null, selectedTrainPlayerIndex = 0;
let players = [
    { name: "ハザード", pos: "FW", atk: 25, def: 5, isStarter: true },
    { name: "サラー", pos: "FW", atk: 28, def: 4, isStarter: true },
    { name: "モドリッチ", pos: "MF", atk: 18, def: 15, isStarter: true },
    { name: "デブライネ", pos: "MF", atk: 22, def: 12, isStarter: true },
    { name: "カンテ", pos: "MF", atk: 10, def: 25, isStarter: true },
    { name: "カゼミロ", pos: "MF", atk: 12, def: 22, isStarter: true },
    { name: "マルセロ", pos: "DF", atk: 15, def: 18, isStarter: true },
    { name: "ファンダイク", pos: "DF", atk: 5, def: 30, isStarter: true },
    { name: "ラモス", pos: "DF", atk: 8, def: 28, isStarter: true },
    { name: "ハキミ", pos: "DF", atk: 16, def: 16, isStarter: true },
    { name: "クルトワ", pos: "GK", atk: 1, def: 25, isStarter: true },
    { name: "ムバッペ", pos: "FW", atk: 27, def: 3, isStarter: false },
    { name: "ネイマール", pos: "FW", atk: 24, def: 5, isStarter: false },
    { name: "クロース", pos: "MF", atk: 16, def: 14, isStarter: false },
    { name: "ブルーノ", pos: "MF", atk: 19, def: 11, isStarter: false },
    { name: "ミリトン", pos: "DF", atk: 4, def: 24, isStarter: false },
    { name: "ロバートソン", pos: "DF", atk: 12, def: 20, isStarter: false },
    { name: "エデルソン", pos: "GK", atk: 1, def: 22, isStarter: false }
];
let teams = [
    { name: "FC FUTURE", win: 0, draw: 0, lose: 0, pts: 0, atk: 150, def: 150 },
    { name: "TOKYO KINGS", win: 0, draw: 0, lose: 0, pts: 0, atk: 180, def: 175 },
    { name: "RIVAL FC", win: 0, draw: 0, lose: 0, pts: 0, atk: 165, def: 165 },
    { name: "OSAKA UTD", win: 0, draw: 0, lose: 0, pts: 0, atk: 170, def: 160 },
    { name: "NAGOYA FC", win: 0, draw: 0, lose: 0, pts: 0, atk: 155, def: 165 }
];
function tab(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    document.getElementById('view-' + name).classList.remove('hidden');
    if (name === 'rank') renderRank();
    if (name === 'tactics') renderTactics();
    if (name === 'train') renderTrainList();
}
function calc() {
    let starterAtk = 0, starterDef = 0;
    players.forEach(p => { if (p.isStarter) { starterAtk += p.atk; starterDef += p.def; } });
    let f = document.getElementById('sel-form').value, s = document.getElementById('sel-sty').value;
    let bonusAtk = (f === '433' ? 15 : 0) + (s === 'atk' ? 10 : 0) - (f === '532' ? 5 : 0);
    let bonusDef = (f === '532' ? 15 : 0) + (s === 'def' ? 10 : 0) - (f === '433' ? 5 : 0) - (s === 'atk' ? 5 : 0);
    fAtk = starterAtk + bonusAtk; fDef = starterDef + bonusDef;
    document.getElementById('h-fatk').innerText = fAtk;
    document.getElementById('h-fdef').innerText = fDef;
    let t = teams.find(x => x.name === "FC FUTURE"); t.atk = fAtk; t.def = fDef;
    updateUI();
}
function renderTactics() {
    let sDiv = document.getElementById('list-starter'), bDiv = document.getElementById('list-bench');
    sDiv.innerHTML = ""; bDiv.innerHTML = "";
    players.forEach((p, index) => {
        let sel = selectedPlayerIndex === index ? "selected" : "";
        let html = `<div class="player-item ${sel}" onclick="selectPlayer(${index})"><div><span class="pos ${p.pos}">${p.pos}</span> <strong>${p.name}</strong></div><div class="p-stats">⚔ATK ${p.atk} / 🛡DEF ${p.def}</div></div>`;
        if (p.isStarter) sDiv.innerHTML += html; else bDiv.innerHTML += html;
    });
}
function selectPlayer(index) {
    if (selectedPlayerIndex === null) { selectedPlayerIndex = index; } else {
        if (selectedPlayerIndex !== index) {
            let p1 = players[selectedPlayerIndex], p2 = players[index];
            let temp = p1.isStarter; p1.isStarter = p2.isStarter; p2.isStarter = temp;
            selectedPlayerIndex = null; calc();
        } else { selectedPlayerIndex = null; }
    }
    renderTactics();
}
function renderTrainList() {
    let div = document.getElementById('list-train-players'); div.innerHTML = "";
    players.forEach((p, index) => {
        let sel = selectedTrainPlayerIndex === index ? "selected" : "";
class="player-item ${sel}" onclick="selectedTrainPlayerIndex=${index}; renderTrainList();"><div><span class="pos ${p.pos}">${p.pos}</span> <strong>${p.name}</strong></div><div class="p-stats">⚔ ${p.atk} / 🛡 ${p.def}</div></div>;});}function train(type){if(tCount<=0){alert("練習回数がありません！");return;}let p=players[selectedTrainPlayerIndex];if(type==='atk')p.atk+=5;else p.def+=5;tCount--;calc();renderTrainList();alert(p.name+"を強化しました！");}function updateUI(){document.getElementById('h-rd').innerText=round;document.getElementById('h-tc').innerText=tCount;document.getElementById('t-tc').innerText=tCount;let opp=teams[((round-1)%(teams.length-1))+1];document.getElementById('h-opp').innerText=opp.name;document.getElementById('m-opp').innerText=opp.name;}function renderRank(){let sorted=[...teams].sort((a,b)=>b.pts-a.pts);let html="";sorted.forEach((t,i)=>{let isMe=t.name==="FC FUTURE"?"style='color:#38bdf8; background:#222a38;'":"";html+=<tr ${isMe}><td>${i+1}</td><td><strong>${t.name}</strong></td><td>${t.win+t.draw+t.lose}</td><td>${t.win}</td><td>${t.draw}</td><td>${t.lose}</td><td><strong>${t.pts}</strong></td></tr>;});document.getElementById('rank-tbody').innerHTML=html;}function startMatch(){document.getElementById('m-btn').disabled=true;let log=document.getElementById('log');let opp=teams[((round-1)%(teams.length-1))+1];log.innerHTML="【キックオフ】試合開始！";let sh=0,sa=0;setTimeout(()=>{if(fAtk>opp.def+Math.random()*20){sh++;log.innerHTML
