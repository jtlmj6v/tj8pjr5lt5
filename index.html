function playMatch(){state.locked=true;if(state.week>seasonLen()){state.season++;state.week=1;state.history=[];state.league.forEach(t=>{t.pts=t.p=t.w=t.d=t.l=t.gf=t.ga=0});state.squad.forEach(p=>{p.form=Math.round((p.form==null?50:p.form)*.5+25)});state.notice="新シーズン開幕！";state.tab="home";render();return}
let opp=opponentName(),str=teamStrength(),oppStrength=79+Math.floor(Math.random()*9),tacticBonus=(TAC[state.tactic]||TAC["バランス"]).a;let gf=Math.max(0,Math.round(Math.random()*2+(str-oppStrength)/13+Math.random()*1.2+tacticBonus*.3+(FX[state.formation]||[0,0])[0])),ga=Math.max(0,Math.round(Math.random()*2+(oppStrength-str)/15+Math.random()*1.1-(TAC[state.tactic]||TAC["バランス"]).g-(FX[state.formation]||[0,0])[1]));gf=Math.min(gf,6);ga=Math.min(ga,6);let outcome=gf>ga?"勝":gf===ga?"分":"敗";let item=state.league.find(t=>t.name===currentClub().name);if(item){item.p++;item.gf+=gf;item.ga+=ga;if(outcome==="勝"){item.w++;item.pts+=3}else if(outcome==="分"){item.d++;item.pts++}else item.l++}let oppRow=state.league.find(t=>t.name===opp);if(oppRow){oppRow.p++;oppRow.gf+=ga;oppRow.ga+=gf;if(ga>gf){oppRow.w++;oppRow.pts+=3}else if(ga===gf){oppRow.d++;oppRow.pts++}else oppRow.l++}
simOthers(opp);let scoredSet={};let scorer=lineupPlayers().filter(p=>p.pos==="FW"||p.pos==="MF").flatMap(p=>formLevel(p)>=4?[p,p]:[p]);for(let i=0;i<gf;i++){let p=scorer[Math.floor(Math.random()*scorer.length)];if(p)scoredSet[p.id]=(scoredSet[p.id]||0)+1;if(p&&p.age<25&&Math.random()<.22){p.ovr=Math.min(99,p.ovr+1)}}let formReport=updateForm(outcome,gf,ga,scoredSet);state.money+=outcome==="勝"?4:outcome==="分"?2:1;state.lastMatch={opp,gf,ga,outcome};state.history.push({week:state.week,opp,score:gf+" - "+ga,outcome});state.notice=`第${state.week}節：${opp}戦は${outcome}。資金・若手の成長・選手の調子を更新しました。`;state.week++;render();state.tab="home";render();alert(`試合終了！\n${currentClub().name} ${gf} - ${ga} ${opp}\n結果：${outcome}\n勝点と資金を更新しました。${formReport}`)}
function wire(){let fm=$("#formation");if(fm)fm.onchange=e=>{state.formation=e.target.value;render()};document.querySelectorAll("[data-tactic]").forEach(b=>b.onclick=()=>{state.tactic=b.dataset.tactic;render()});document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.goto;render()});document.querySelectorAll("[data-bench]").forEach(b=>b.onclick=()=>{let id=b.dataset.bench;state.lineup=state.lineup.filter(x=>x!==id);state.bench.push(id);state.notice=player(id).name+"をベンチに移動しました";render()});document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{let id=b.dataset.start;if(state.lineup.length>=11){let out=state.lineup.pop();state.bench.push(out)}state.bench=state.bench.filter(x=>x!==id);state.lineup.push(id);state.notice=player(id).name+"をスタメンに起用しました";render()});document.querySelectorAll("[data-mk]").forEach(e=>e.onchange=()=>{state.mk[e.dataset.mk]=e.value;state.mk.n=30;render()});let mm=$("#mkMore");if(mm)mm.onclick=()=>{state.mk.n+=30;render()};document.querySelectorAll("[data-nego]").forEach(b=>b.onclick=()=>startNego(b.dataset.nego));document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{let p=mkPool().find(x=>x.key===b.dataset.buy);if(!p)return;if(state.money<p.ask){alert("資金が足りません！");return}sign(p,p.ask,p.wish)});let ob=$("#offerBtn");if(ob)ob.onclick=makeOffer;let nc=$("#negoCancel");if(nc)nc.onclick=()=>{state.nego=null;render()};let play=$("#playMatch");if(play)play.onclick=playMatch;let reset=$("#resetCareer");if(reset)reset.onclick=()=>{if(confirm("このクラブのキャリアをリセットしますか？"))initClub(state.club)};let exp=$("#exportSave");if(exp)exp.onclick=()=>{$("#saveOutput").textContent=JSON.stringify(state,null,2)}}
$("#clubSelect").addEventListener("change",e=>{if(state.locked){render();return}initClub(Number(e.target.value));state.locked=true;state.notice=currentClub().name+"で決定！クラブの変更はキャリアのリセット時のみ可能です。";render()});
initClub(0);
</script>
</body></html>
