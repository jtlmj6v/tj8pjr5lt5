<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放置育成マルチサッカー</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 10px; margin: 0; box-sizing: border-box; }
        h1 { font-size: 20px; margin: 10px 0; }
        h2, h3 { font-size: 16px; margin: 5px 0 10px 0; }
        .card { background: #2a2a2a; padding: 12px; border-radius: 10px; max-width: 400px; margin: 10px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { color: white; border: none; padding: 12px 15px; font-size: 14px; border-radius: 5px; cursor: pointer; margin: 6px; width: 90%; display: inline-block; -webkit-appearance: none; }
        #train-atk-btn, #train-def-btn { background: #00c853; }
        #save-btn { background: #0288d1; }
        #match-btn { background: #d32f2f; font-weight: bold; }
        .status { font-size: 15px; margin: 6px 0; }
        #vs-display { margin-top: 5px; font-size: 15px; font-weight: bold; color: #ffeb3b; }
        #log { background: #000; color: #0f0; padding: 8px; border-radius: 5px; text-align: left; height: 120px; overflow-y: auto; font-family: monospace; font-size: 11px; }
    </style>
</head>
<body>

    <h1>⚽ 育成＆非同期マルチバトル</h1>

    <!-- 1. 自分のチーム管理 -->
    <div class="card">
        <h2>🏋️ 自分のチーム管理</h2>
        <div class="status">チーム名: <span id="my-name">FC FUTURE</span></div>
        <div class="status">⚔️ ATK: <span id="my-atk">10</span> / 🛡️ DEF: <span id="my-def">10</span></div>
        <button id="train-atk-btn">💪 攻撃力を特訓 (+5)</button>
        <button id="train-def-btn">🏃 守備力を特訓 (+5)</button>
        <button id="save-btn">💾 データをサーバーに保存</button>
    </div>

    <!-- 2. 試合スタジアム -->
    <div class="card">
        <h2>🏟️ 試合スタジアム</h2>
        <button id="match-btn">⚔️ 他のプレイヤーと対戦！</button>
        <div id="vs-display"></div>
    </div>

    <!-- 3. 通信・試合ログ -->
    <div class="card">
        <h3>📋 試合・通信ログ</h3>
        <div id="log">ゲームが起動しました。まずは特訓して保存してみよう！</div>
    </div>

    <script type="module">
        import { createClient } from 'https://jsdelivr.net'

        const SUPABASE_URL = 'https://supabase.co'
        const SUPABASE_KEY = 'sb_publishable_aNOURrGhRme3kbJAAp2qLA_2qDXPO2K'
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

        // テスト用のプレイヤーID（友達と遊ぶ時はここを別の文字に変えてね）
        const MY_PLAYER_ID = "player_tester_999"; 
        
        let myTeamName = "FC FUTURE";
        let myAtk = 10;
        let myDef = 10;

        function addLog(text) {
            const logDiv = document.getElementById("log");
            logDiv.innerHTML += "<br>> " + text;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateUI() {
            document.getElementById("my-atk").innerText = myAtk;
            document.getElementById("my-def").innerText = myDef;
        }

        // HTMLが完全に読み込まれてからボタンのイベントを確実に登録する
        window.addEventListener('DOMContentLoaded', () => {
            
            document.getElementById("train-atk-btn").addEventListener("click", (e) => {
                e.preventDefault();
                myAtk += 5;
                updateUI();
                addLog("攻撃力を特訓しました！");
            });

            document.getElementById("train-def-btn").addEventListener("click", (e) => {
                e.preventDefault();
                myDef += 5;
                updateUI();
                addLog("守備力を特訓しました！");
            });

            document.getElementById("save-btn").addEventListener("click", async (e) => {
                e.preventDefault();
                addLog("サーバーに送信中...");
                const { error } = await supabase
                    .from('players')
                    .upsert({ 
                        id: MY_PLAYER_ID, 
                        team_name: myTeamName, 
                        attack_power: myAtk, 
                        defense_power: myDef,
                        points: 0
                    });

                if (error) {
                    addLog("エラー: 保存失敗。");
                    console.error(error);
                } else {
                    addLog("🎉 保存成功！サーバーに送られました。");
                }
            });

            document.getElementById("match-btn").addEventListener("click", async (e) => {
                e.preventDefault();
                addLog("対戦相手を探しています...");
                
                const { data, error } = await supabase
                    .from('players')
                    .select('*')
                    .neq('id', MY_PLAYER_ID);

                if (error || !data || data.length === 0) {
                    addLog("対戦相手がまだいません。別のブラウザやIDでデータを保存してください。");
                    return;
                }

                const randomIndex = Math.floor(Math.random() * data.length);
                const opponent = data[randomIndex];
                
                document.getElementById("vs-display").innerHTML = `VS ${opponent.team_name} (敵ATK:${opponent.attack_power}/DEF:${opponent.defense_power})`;
                addLog(`対戦相手: ${opponent.team_name}`);

                let myScore = 0;
                let opponentScore = 0;

                if (myAtk > opponent.defense_power) myScore += Math.floor(Math.random() * 3) + 1;
                if (opponent.attack_power > myDef) opponentScore += Math.floor(Math.random() * 3) + 1;

                addLog(`【結果】 ${myScore} - ${opponentScore}`);
                if (myScore > opponentScore) {
                    addLog("🏆 勝ち！");
                } else if (myScore < opponentScore) {
                    addLog("💀 負け...");
                } else {
                    addLog("🤝 引き分け");
                }
            });
        });
    </script>
</body>
</html>
