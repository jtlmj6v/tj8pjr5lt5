<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サッカー監督ゲーム</title>
<style>
body{font-family:sans-serif;background:#121824;color:#e2e8f0;margin:0;padding:15px;}
.container{max-width:550px;margin:0 auto;background:#1e293b;padding:15px;border-radius:12px;border:1px solid #334155;}
h1,h2{text-align:center;color:#f8fafc;margin:5px 0;}
.ranking-table{width:100%;border-collapse:collapse;margin:10px 0;background:#0f172a;border-radius:6px;overflow:hidden;font-size:12px;text-align:center;}
.ranking-table th{background:#1e293b;color:#38bdf8;padding:6px;}
.ranking-table td{padding:6px;border-bottom:1px solid #1e293b;}
.ranking-table tr.my-team{background:rgba(56,189,248,.15);font-weight:bold;color:#38bdf8;}
.score-board{display:flex;justify-content:space-around;margin:10px 0;background:#0f172a;padding:8px;border-radius:6px;border:1px solid #334155;text-align:center;}
.score-num{font-size:18px;font-weight:bold;color:#38bdf8;}
.panel{background:#1e293b;border:1px solid #475569;border-radius:8px;padding:12px;margin-bottom:10px;}
.panel-title{font-weight:bold;margin-bottom:8px;color:#f1f5f9;border-bottom:2px solid #38bdf8;padding-bottom:3px;font-size:14px;}
.player-card{background:#0f172a;border:1px solid #334155;border-radius:6px;padding:8px;margin:6px 0;}
.player-info{display:flex;justify-content:space-between;font-weight:bold;font-size:13px;margin-bottom:4px;}
.player-pos{font-size:10px;padding:1px 4px;border-radius:3px;color:#0f172a;}
.pos-fw{background:#f43f5e;}.pos-mf{background:#eab308;}.pos-df{background:#22c55e;}.pos-gk{background:#a855f7;}
.param-row{display:flex;justify-content:space-between;align-items:center;margin:3px 0;font-size:12px;}
.param-btn{background:#38bdf8;color:#0f172a;border:none;width:22px;height:22px;border-radius:50%;font-weight:bold;cursor:pointer;}
.param-btn:disabled{background:#64748b;}
.param-val{font-weight:bold;min-width:20px;text-align:center;}
.radio-group{display:flex;gap:8px;}
.radio-group label{flex:1;text-align:center;background:#0f172a;border:1px solid #475569;padding:8px;border-radius:6px;cursor:pointer;font-size:12px;color:#94a3b8;}
.radio-group input{display:none;}
.radio-group input:checked+span{font-weight:bold;color:#38bdf8;}
.radio-group label:has(input:checked){background:#1e293b;border-color: #38bdf8;}
button.main-btn{display:block;width:100%;background:#0284c7;color:#fff;border:none;padding:12px;font-size:16px;border-radius:8px;cursor:pointer;font-weight:bold;}
button.main-btn:disabled{background:#64748b;}
.commentary{background:#020617;color:#4ade80;font-family:monospace;padding:10px;border-radius:6px;min-height:90px;max-height:120px;overflow-y:auto;white-space:pre-line;font-size:12px;border:1px solid #334155;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="container">
<h1>⚽ サッカー監督ゲーム</h1>
<div id="game-screen">
<h2>FC FUTURE</h2>
<div style="text-align:center;font-weight:bold;font-size:12px;color:#94a3b8;" id="season-display">シーズン 1</div>
<div style="text-align:center;font-size:16px;font-weight:bold;color:#38bdf8;" id="match-display">第 1 / 32 節</div>
<table class="ranking-table">
<thead><tr><th>順</th><th style="text-align:left;padding-left:10px;">チーム名</th><th>勝点</th><th>得失差</th><th>試合数</th></tr></thead>
<tbody id="ranking-body"></tbody>
</table>
<div class="score-board">
<div class="score-item"><div class="score-num" id="wins">0</div><div style="color:#94a3b8;font-size:10px;">勝利</div></div>
<div class="score-item"><div class="score-num" id="draws">0</div><div style="color:#94a3b8;font-size:10px;">引分</div></div>
<div class="score-item"><div class="score-num" id="losses">0</div><div style="color:#94a3b8;font-size:10px;">敗戦</div></div>
<div class="score-item"><div class="score-num" id="points">0</div><div style="color:#94a3b8;font-size:10px;">勝点</div></div>
</div>
<div class="panel">
<div class="panel-title">👥 選手個別育成 (残りCP: <span id="cp-left">10</span>)</div>
<div class="player-card">
<div class="player-info"><span>佐藤 健太</span><span class="player-pos pos-fw">FW</span></div>
<div class="param-row"><span>⚔ オフェンス</span><div><button class="param-btn" onclick="adjustPlayerParam('fw','offense',-1)">-</button><span class="param-val" id="val-fw-off">10</span><button class="param-btn" onclick="adjustPlayerParam('fw','offense',1)">+</button></div></div>
<div class="param-row"><span>🏃 スタミナ</span><div><button class="param-btn" onclick="adjustPlayerParam('fw','stamina',-1)">-</button><span class="param-val" id="val-fw-sta">10</span><button class="param-btn" onclick="adjustPlayerParam('fw','stamina',1)">+</button></div></div>
</div>
<div class="player-card">
<div class="player-info"><span>鈴木 翼</span><span class="player-pos pos-mf">MF</span></div>
<div class="param-row"><span>⚔ オフェンス</span><div><button class="param-btn" onclick="adjustPlayerParam('mf','offense',-1)">-</button><span class="param-val" id="val-mf-off">10</span><button class="param-btn" onclick="adjustPlayerParam('mf','offense',1)">+</button></div></div>
<div class="param-row"><span>🛡 ディフェンス</span><div><button class="param-btn" onclick="adjustPlayerParam('mf','defense',-1)">-</button><span class="param-val" id="val-mf-def">10</span><button class="param-btn" onclick="adjustPlayerParam('mf','defense',1)">+</button></div></div>
</div>
<div class="player-card">
<div class="player-info"><span>高橋 大樹</span><span class="player-pos pos-df">DF</span></div>
<div class="param-row"><span>🛡 ディフェンス</span><div><button class="param-btn" onclick="adjustPlayerParam('df','defense',-1)">-</button><span class="param-val" id="val-df-def">10</span><button class="param-btn" onclick="adjustPlayerParam('df','defense',1)">+</button></div></div>
<div class="param-row"><span>🏃 スタミナ</span><div><button class="param-btn" onclick="adjustPlayerParam('df','stamina',-1)">-</button><span class="param-val" id="val-df-sta">10</span><button class="param-btn" onclick="adjustPlayerParam('df','stamina',1)">+</button></div></div>
</div>
<div class="player-card">
<div class="player-info"><span>田中 守</span><span class="player-pos pos-gk">GK</span></div>
<div class="param-row"><span>🛡 ディフェンス</span><div><button class="param-btn" onclick="adjustPlayerParam('gk','defense',-1)">-</button><span class="param-val" id="val-gk-def">10</span><button class="param-btn" onclick="adjustPlayerParam('gk','defense',1)">+</button></div></div>
</div>
</div>
<div class="panel">
<div class="panel-title">フォーメーション</div>
<div class="radio-group">
<label><input type="radio" name="formation" value="4-3-3" checked><span>4-3-3<br><small>(攻撃)</small></span></label>
<label><input type="radio" name="formation" value="4-4-2"><span>4-4-2<br><small>(均衡)</small></span></label>
<label><input type="radio" name="formation" value="3-5-2"><span>3-5-2<br><small>(中盤)</small></span></label>
</div>
</div>
<div class="panel">
<div class="panel-title">戦術方針</div>
<div class="radio-group">
<label><input type="radio" name="tactics" value="attack" checked><span>🔥 攻撃</span></label>
<label><input type="radio" name="tactics" value="balance"><span>⚖ バランス</span></label>
<label><input type="radio" name="tactics" value="defense"><span>🛡 守備</span></label>
</div>
</div>
<button class="main-btn" id="start-btn" onclick="playMatch()">⚽ 試合開始</button>
<div style="margin-top:10px;">
<div style="font-weight:bold;margin-bottom:3px;font-size:12px;color:#94a3b8;">📢 試合実況</div>
<div class="commentary" id="commentary-box">試合開始を待っています……</div>
</div>
</div>
<div id="season-end-screen" class="hidden">
<h2>🏆 シーズン終了</h2>
<div style="text-align:center;font-size:18px;margin:10px 0;">最終順位：<strong id="final-rank" style="color:#38bdf8;font-size:28px;">0</strong> 位</div>
<div style="text-align:center;font-size:14px;margin-bottom:10px;color:#94a3b8;">獲得勝点：<span id="final-points">0</span> pt</div>
<div class="panel" style="text-align:center;font-size:13px;"><p id="season-review">お疲れ様でした！</p></div>
<button class="main-btn" onclick="nextSeason()">🔄 次のシーズンへ</button>
</div>
</div>
<script>
    let season = 1, match = 1; const totalMatchesCount = 32;
    let teams = [
        { name: "FC FUTURE", wins: 0, draws: 0, losses: 0, points: 0, gf: 0, ga: 0, gd: 0, isPlayer: true },
        { name: "マドリードFC", wins: 0, draws: 0, losses: 0, points: 0, gf: 0, ga: 0, gd: 0, isPlayer: false },
        { name: "ミュンヘン・N", wins: 0, draws: 0, losses: 0, points: 0, gf: 0, ga: 0, gd: 0, isPlayer: false },
        { name: "ミラノ・A", wins: 0, draws: 0, losses: 0, points: 0, gf: 0, ga: 0, gd: 0, isPlayer: false }
    ];
    let players = {
        fw: { name: "佐藤 健太", offense: 10, stamina: 10 },
        mf: { name: "鈴木 翼", offense: 10, defense: 10 },
        df: { name: "高橋 大樹", defense: 10, stamina: 10 },
        gk: { name: "田中 守", defense: 10 }
    };
    let cp = 10;

    function updateUI() {
        document.getElementById('season-display').textContent = `シーズン ${season}`;
        document.getElementById('match-display').textContent = `第 ${match} / ${totalMatchesCount} 節`;
        const p = teams.find(t => t.isPlayer);
        document.getElementById('wins').textContent = p.wins;
        document.getElementById('draws').textContent = p.draws;
        document.getElementById('losses').textContent = p.losses;
        document.getElementById('points').textContent = p.points;
        document.getElementById('cp-left').textContent = cp;
        document.getElementById('val-fw-off').textContent = players.fw.offense;
        document.getElementById('val-fw-sta').textContent = players.fw.stamina;
        document.getElementById('val-mf-off').textContent = players.mf.offense;
        document.getElementById('val-mf-def').textContent = players.mf.defense;
        document.getElementById('val-df-def').textContent = players.df.defense;
        document.getElementById('val-df-sta').textContent = players.df.stamina;
        document.getElementById('val-gk-def').textContent = players.gk.defense;
        renderRanking();
    }

    function adjustPlayerParam(role, type, amount) {
        if (amount > 0 && cp > 0) { players[role][type]++; cp--; }
        else if (amount < 0 && players[role][type] > 10) { players[role][type]--; cp++; }
        updateUI();
    }

    function renderRanking() {
        teams.sort((a, b) => b.points !== a.points ? b.points - a.points : b.gd - a.gd);
        const tbody = document.getElementById('ranking-body'); tbody.innerHTML = "";
        teams.forEach((t, i) => {
            const tr = document.createElement('tr'); if (t.isPlayer) tr.className = "my-team";
            tr.innerHTML = `<td>${i + 1}</td><td style="text-align:left;padding-left:10px;">${t.name}</td><td>${t.points}</td><td>${t.gd>0?'+'+t.gd:t.gd}</td><td>${match-1}/${totalMatchesCount}</td>`;
            tbody.appendChild(tr);
        });
    }

    function playMatch() {
        if (match > totalMatchesCount) return;
        const startBtn = document.getElementById('start-btn'); startBtn.disabled = true;
        const formation = document.querySelector('input[name="formation"]:checked').value;
        const tactics = document.querySelector('input[name="tactics"]:checked').value;
        const rivals = teams.filter(t => !t.isPlayer); const activeRival = rivals[(match + season) % rivals.length];

        const rivalBase = 9 + (match * 0.25) + (season * 2.5);
        const rOff = rivalBase + Math.random() * 5, rDef = rivalBase + Math.random() * 5;
        let myOff = (players.fw.offense + players.mf.offense) / 2;
        let myDef = (players.df.defense + players.mf.defense + players.gk.defense) / 3;

        if (formation === '4-3-3') { myOff += 2.5; myDef -= 1; }
        if (formation === '3-5-2') { myOff += 1; myDef += 1; }
        if (tactics === 'attack') { myOff += 3; myDef -= 2; }
        if (tactics === 'defense') { myOff -= 2; myDef += 3; }

        let fwStam = players.fw.stamina > 12 ? (players.fw.stamina - 12) * 0.3 : (players.fw.stamina - 12) * 0.5;
        let dfStam = players.df.stamina > 12 ? (players.df.stamina - 12) * 0.3 : (players.df.stamina - 12) * 0.5;

        const commBox = document.getElementById('commentary-box');
        commBox.textContent = `キックオフ！ FC FUTURE vs ${activeRival.name}\n`;
        let myScore = 0, rivalScore = 0;

        setTimeout(() => {
            commBox.textContent += `[前半] `;
            if (myOff * Math.random() > rDef * Math.random()) { myScore++; commBox.textContent += `⚽ ゴール！FW${players.fw.name}が決めた！\n`; }
            else if (rOff * Math.random() > myDef * Math.random()) { rivalScore++; commBox.textContent += `⚠️ 失点… ディフェンス陣が崩されました。\n`; }
            else { commBox.textContent += `一進一退。GK${players.gk.name}が死守。\n`; }
            commBox.scrollTop = commBox.scrollHeight;
        }, 800);

        setTimeout(() => {
            commBox.textContent += `[後半] `;
            if ((myOff + fwStam) * Math.random() > rDef * Math.random()) { myScore++; commBox.textContent += `⚽ ゴール！後半も足が止まらない${players.fw.name}が押し込んだ！\n`; }
            else if (rOff * Math.random() > (myDef + dfStam) * Math.random()) { rivalScore++; commBox.textContent += `⚠️ 失点… スタミナ切れの隙を突かれました。\n`; }
            else { commBox.textContent += `激しい攻防。DF${players.df.name}が体を張ってクリア！\n`; }

            commBox.textContent += `\n【試合終了】 FC FUTURE ${myScore} - ${rivalScore} ${activeRival.name}\n`;
            const pTeam = teams.find(t => t.isPlayer); pTeam.gf += myScore; pTeam.ga += rivalScore; pTeam.gd += (myScore - rivalScore);
            
            if (myScore > rivalScore) { pTeam.wins++; pTeam.points += 3; commBox.textContent += `🎉 見事な勝利です！`; }
            else if (myScore === rivalScore) { pTeam.draws++; pTeam.points += 1; commBox.textContent += `🤝 ドローゲーム。`; }
            else { pTeam.losses++; commBox.textContent += `😢 惜しくも敗戦。`; }

            // 他チームの試合結果を裏で簡易計算
            rivals.forEach(t => {
                if(t.name !== activeRival.name) {
                    let s1 = Math.floor(Math.random()*3), s2 = Math.floor(Math.random()*3);
                    t.gf += s1; t.ga += s2; t.gd += (s1-s2);
                    if(s1>s2){t.points+=3; t.wins++;} else if(s1===s2){t.points+=1; t.draws++;} else {t.losses++;}
                } else {
                    t.gf += rivalScore; t.ga += myScore; t.gd += (rivalScore - myScore);
                    if(rivalScore>myScore){t.points+=3; t.wins++;} else if(rivalScore===myScore){t.points+=1; t.draws++;} else {t.losses++;}
                }
            });

            match++; updateUI(); commBox.scrollTop = commBox.scrollHeight; startBtn.disabled = false;
            if (match > totalMatchesCount) setTimeout(showSeasonEnd, 1500);
        }, 1800);
    }

    function showSeasonEnd() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('season-end-screen').classList.remove('hidden');
        renderRanking(); const myRank = teams.findIndex(t => t.isPlayer) + 1;
        document.getElementById('final-rank').textContent = myRank;
        document.getElementById('final-points').textContent = teams.find(t => t.isPlayer).points;
        const review = document.getElementById('season-review');
        review.innerHTML = myRank === 1 ? "🏆 リーグ優勝達成！！ 名将の誕生です！" : "👏 惜しくも優勝を逃しました。次こそ頂点へ！";
    }

    function nextSeason() {
        season++; match = 1; cp += 15;
        teams.forEach(t => { t.wins = 0; t.draws = 0; t.losses = 0; t.points = 0; t.gf = 0; t.ga = 0; t.gd = 0; });
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('season-end-screen').classList.add('hidden');
        document.getElementById('commentary-box').textContent = `新シーズン（シーズン ${season}）開幕！`;
        updateUI();
    }
    updateUI();
</script>
</body>
</html>
