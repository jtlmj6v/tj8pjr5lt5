function updateForm(outcome,gf,ga,scored){let starters=new Set(state.lineup),ups=[],downs=[];state.squad.forEach(p=>{if(p.form==null)p.form=50;let before=formLevel(p),d=0;if(starters.has(p.id)){d+=outcome==="勝"?7:outcome==="分"?0:-7;d+=(scored[p.id]||0)*9;if(p.pos==="GK"||p.pos==="DF")d+=ga===0?6:ga>=3?-5:0;d+=(50-p.form)*.12+(Math.random()-.5)*12}else{d+=(50-p.form)*.2-1+(Math.random()-.5)*6}p.form=Math.max(0,Math.min(100,p.form+d));p.value=curValue(p.ovr,p.age,p.form);let after=formLevel(p);if(after>before&&after>=4)ups.push(p.name);if(after<before&&after<=2)downs.push(p.name)});return(ups.length?"\n📈 調子上昇："+ups.slice(0,3).join("、"):"")+(downs.length?"\n📉 調子下降："+downs.slice(0,3).join("、"):"")}

let gx=g(sx.str,sy.str,tx,ty,fx,fy,sx.cf.a,sy.cf.g),gy=g(sy.str,sx.str,ty,tx,fy,fx,sy.cf.a,sx.cf.g),ev=[];
let mk=(ps,n,side)=>{for(let i=0;i<n;i++){let lv=p=>Math.max(1,(p.ovr-50)/10);let w=ps.map(p=>({GK:0,DF:1,MF:4,FW:12}[p.pos])*lv(p)*(p.form>=60?1.3:1));let sc=vsPick(ps,w,r)||ps[1];let ow=ps.map(p=>p===sc||p.pos==="GK"?0:({DF:2,MF:7,FW:5}[p.pos])*lv(p));let as=r()<.7?vsPick(ps,ow,r):null;ev.push({m:1+Math.floor(r()*90),side,sc:sc.name,as:as?as.name:""})}};
mk(sx.ps,gx,sw?"op":"me");mk(sy.ps,gy,sw?"me":"op");ev.sort((a,b)=>a.m-b.m);
let pk=null;if(gx===gy){let px=.5+(sx.str-sy.str)/150;let xw=r()<Math.max(.2,Math.min(.8,px));pk=(xw?!sw:sw)?"me":"op"}
let gf=sw?gy:gx,ga=sw?gx:gy;
return{key,myN:me.n,opN:op.n,myS:(sw?sy:sx).str,opS:(sw?sx:sy).str,gf,ga,ev,pk,oc:gf>ga?"勝":gf===ga?"分":"敗"}}
function vsNew(){return{rec:{w:0,d:0,l:0},seen:{},log:[],opp:null,res:null}}
function vsLine(ps){return ps.map(p=>`<div class="statrow"><span><span class="pill">${p.pos}</span> ${vsEsc(p.name)}</span><b>${p.ovr}</b></div>`).join("")}
function vsView(){
state.vs=state.vs||vsNew();let V=state.vs,me=vsMake(),code=vsEnc(me),mi=vsStr(vsDec(code)),link=location.href.split("#")[0]+"#vs="+code;
let ta="width:100%;min-height:92px;background:#202d43;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;font:11px/1.4 monospace;word-break:break-all;resize:vertical";
let res="";
if(V.res){let R=V.res;res=`<section class="card c12"><h2>⚔️ 対戦結果</h2><div class="result"><div class="muted" style="font-size:12px">${vsEsc(R.myN)} (チーム力${R.myS}) vs ${vsEsc(R.opN)} (チーム力${R.opS})</div><div class="score">${R.gf} - ${R.ga}</div><span class="pill">${R.oc==="勝"?"🏆 勝利":R.oc==="敗"?"敗北":"引き分け"}</span>${R.pk?`<div class="muted" style="margin-top:6px">PK戦：${R.pk==="me"?vsEsc(R.myN):vsEsc(R.opN)}の勝ち（記録上は引き分け）</div>`:""}</div><div class="log" style="margin-top:10px">${R.ev.length?R.ev.map(e=>`<div class="statrow"><span>${e.m}' ⚽ ${vsEsc(e.sc)}${e.as?`（アシスト ${vsEsc(e.as)}）`:""}</span><b>${e.side==="me"?vsEsc(R.myN):vsEsc(R.opN)}</b></div>`).join(""):'<div class="muted">無得点の試合でした。</div>'}</div><p class="muted" style="font-size:12px;margin-top:10px">お互いが相手に送ったコードで対戦すれば、相手の画面でも同じ結果になります。${R.dup?"（この組み合わせは記録済みです）":""}</p></section>`}
let opp="";
if(V.opp){let o=V.opp.o,oi=vsStr(o);opp=`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;align-items:center"><b>${vsEsc(o.n)}</b><span class="pill">チーム力 ${oi.str}</span></div><div class="muted" style="font-size:12px;margin:4px 0">${vsEsc(o.f)} / ${vsEsc(o.t)}</div>${vsLine(oi.ps)}</div><div class="actions"><button class="primary" id="vsFight">⚔️ 対戦開始</button><button id="vsClear">相手を外す</button></div>`}
return`<div class="grid">${res}
<section class="card c6"><h2>📤 自分のチームコード</h2><div class="muted" style="font-size:12px;margin-bottom:6px">${vsEsc(me.n)} · ${vsEsc(me.f)} / ${vsEsc(me.t)} · チーム力 <b>${mi.str}</b>。現在のスタメン・陣形・戦術・調子がそのまま反映されます。</div><textarea id="vsCode" readonly style="${ta}" onclick="this.select()">${code}</textarea><div class="actions" style="margin-top:8px"><button class="primary" id="vsCopy">コードをコピー</button><button id="vsCopyLink" data-link="${vsEsc(link)}">リンクをコピー</button>${navigator.share?`<button id="vsShare" data-link="${vsEsc(link)}">共有</button>`:""}</div><div style="margin-top:10px">${vsLine(mi.ps)}</div></section>
<section class="card c6"><h2>📥 対戦相手</h2><p class="muted" style="font-size:12px;margin:0 0 6px">相手のチームコード（またはリンク）を貼り付けて読み込みます。</p><textarea id="vsIn" style="${ta}" placeholder="FMV1:..."></textarea><div class="actions" style="margin-top:8px"><button id="vsLoad">読み込む</button></div>${opp}</section>
<section class="card c12"><h2>📊 対戦成績</h2><div class="statrow"><span>通算 勝・分・敗</span><b>${V.rec.w} / ${V.rec.d} / ${V.rec.l}</b></div>${V.log.length?V.log.slice().reverse().map(x=>`<div class="statrow"><span>vs ${vsEsc(x.n)}</span><b>${x.sc} <span class="pill">${x.o}</span></b></div>`).join(""):'<div class="empty">対戦するとここに成績が残ります。リーグ戦や資金・シーズンの進行には影響しない、いつでも遊べる交流戦です。</div>'}</section></div>`}
function vsCopyOld(txt,done){let t=document.createElement("textarea");t.value=txt;t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(t)}
function vsCopy(txt,btn){let done=()=>{if(btn){let o=btn.textContent;btn.textContent="コピーしました ✓";setTimeout(()=>{btn.textContent=o},1500)}};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>vsCopyOld(txt,done));else vsCopyOld(txt,done)}
function wireVs(){let b,V=state.vs||(state.vs=vsNew());
if(b=$("#vsCopy"))b.onclick=()=>vsCopy($("#vsCode").value,b);
if(b=$("#vsCopyLink"))b.onclick=()=>vsCopy(b.dataset.link,b);
if(b=$("#vsShare"))b.onclick=()=>{try{navigator.share({title:"FOOTBALL MANAGER 対戦",text:currentClub().name+"と対戦しよう！",url:b.dataset.link})}catch(e){}};
if(b=$("#vsLoad"))b.onclick=()=>{let p=vsPayload($("#vsIn").value),o=p&&vsDec(p);if(!o){alert("チームコードを読み取れませんでした。\n「FMV1:」で始まるコード全体、またはリンクを貼り付けてください。");return}V.opp={code:p,o};V.res=null;render()};
if(b=$("#vsClear"))b.onclick=()=>{V.opp=null;V.res=null;render()};
if(b=$("#vsFight"))b.onclick=()=>{if(!V.opp)return;let mc=vsEnc(vsMake()),R=vsBattle(mc,V.opp.code);if(!R){alert("対戦を開始できませんでした。コードを読み込み直してください。");return}let first=!V.seen[R.key]&&mc!==V.opp.code;if(first){V.seen[R.key]=1;V.rec[R.oc==="勝"?"w":R.oc==="分"?"d":"l"]++;V.log.push({n:R.opN,sc:R.gf+"-"+R.ga,o:R.oc});if(V.log.length>20)V.log.shift()}R.dup=!first;V.res=R;render()}}
function vsFromHash(){try{let p=vsPayload(decodeURIComponent(location.hash||"")),o=p&&vsDec(p);if(!o)return;state.vs=state.vs||vsNew();state.vs.opp={code:p,o};state.vs.res=null;state.tab="vs";try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}render()}catch(e){}}

vsFromHash();
</script>
</body></html>
